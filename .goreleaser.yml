version: 2

project_name: tesdecrypt

before:
  hooks:
    - go mod tidy

builds:
  - id: tesdecrypt
    main: ./cmd/tesdecrypt
    binary: tesdecrypt
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

# releaser-pleaser writes the release notes when it creates the release, so
# GoReleaser only uploads the artifacts and appends the footer below.
changelog:
  disable: true

release:
  mode: append
  footer: |
    Decrypts your own Tesla dashcam footage locally. Only clip identifiers and
    the ownership metadata already in each header reach Tesla; the video never
    leaves your machine.
