pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --redact
    fmt:
      glob: "*.go"
      run: test -z "$(gofmt -l {staged_files})"
    lint:
      glob: "*.go"
      run: go tool golangci-lint run ./...

commit-msg:
  commands:
    conventional-and-english:
      run: |
        subject=$(head -1 "{1}")
        # skip auto-generated messages
        case "$subject" in Merge*|Revert*|fixup!*|squash!*) exit 0 ;; esac
        # 1) Conventional Commits
        echo "$subject" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/ -]+\))?!?: .+' \
          || { echo "✖ Commit must be Conventional Commits: type(scope): subject"; exit 1; }
        # 2) English only (heuristic) — ignore comment lines and trailers
        body=$(grep -vE '^(#|Co-authored-by:|Co-Authored-By:|Signed-off-by:)' "{1}")
        if echo "$body" | grep -qiE '[áéíóúñ¿¡]|\b(añade|arregla|corrige|elimina|actualiza|cambia|mejora|quita|sube|prueba|versión|imagen|fichero|mensaje|además|también|porque|desde|según|aquí|para|con|los|las|del|una|que)\b'; then
          echo "✖ Commit looks Spanish — commit messages must be in English."; exit 1
        fi
